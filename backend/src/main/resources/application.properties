# ============================================================================
# ICON INTERIORS - SPRING BOOT APPLICATION CONFIGURATION
# Production-ready for Render Web Services & Local Development
# ============================================================================

server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/

spring.application.name=icon-interiors-backend

# ----------------------------------------------------------------------------
# PostgreSQL Connection Settings (Render & Local)
# Override via SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# ----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/icon_interiors_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Ashik@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Init / Migrations (Seeds Categories & Admin on First Boot)
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# ----------------------------------------------------------------------------
# Security & JWT Configuration
# ----------------------------------------------------------------------------
icon.app.jwtSecret=${JWT_SECRET:9a4f2c8d3e7b1a5f6c8d2e4b7a1c9f3e5b8d2a6c4e7f1b9a3d5e8c2f4b7a1d3e}
icon.app.jwtExpirationMs=86400000

# ----------------------------------------------------------------------------
# File Upload Settings for Admin Gallery CMS
# ----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
icon.upload.dir=uploads/designs

